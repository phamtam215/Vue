<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vue Basics</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
   <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Vue Course Goals</h1>
    </header>
    <section id="user-goals">
      <h2>My course goals</h2>
      <input type="text" v-model="goalInput" />
      <button @click="addGoal">Add Goal</button>
      <p v-if="goals.length === 0">No goals have been added yet - please start adding some!</p>
      <ul v-else>
         <li v-for="(goal,index) in goals" @click="removeGoal(index)">
          <p>{{ goal.text }}</p>

          <!-- @click.stop là một directive trong Vue dùng để lắng nghe sự kiện click chuột, đồng thời ngăn chặn sự kiện đó lan ra các phần tử cha., làm cho goal không gọi removeGoal(index) -->

          <input type="text" @click.stop/>
          </li>
      <!--  <li v-for="(value, key, index) in {name: 'Max', age: 30, country: 'USA'}">{{ index }} : {{ key }}: {{ value }}</li>
        <li v-for="num in 3">{{ num }}</li> -->

      </ul>
    </section>
  </body>
</html>
