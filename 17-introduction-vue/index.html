<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vue Basics</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Vue Course Goals</h1>
    </header>
    <section id="user-goal">
      <h2>My Course Goal</h2>
      <p>{{ courseGoal }}</p>
      <p>{{ outputGoal() }}</p>
      <!-- not work because the curly braces only work in the opening and closing html tags -->
      <!-- <p>Lean more <a href = {{"vueLink"}}>here</a></p> -->

      <!-- what is v-bind do ? -> v-bind is a directive that dynamically binds an attribute to an expression -->
      <p>Learn more <a v-bind:href="vueLink">here</a></p>

    </section>
  </body>
</html>
